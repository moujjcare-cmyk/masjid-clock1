name: Build Android APK (Native Silent Bridge)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare Web Assets & Capacitor Android
        run: |
          npm install
          npm run build
          npx cap add android || true
          npx cap copy android

      - name: Inject DND Auto-Silent Permission into AndroidManifest.xml
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/<application/<uses-permission android:name="android.permission.ACCESS_NOTIFICATION_POLICY" \/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" \/>\n    <uses-permission android:name="android.permission.WAKE_LOCK" \/>\n    <application/' "$MANIFEST"
          fi

      - name: Inject Native Hardware Silent Bridge into MainActivity.java
        run: |
          MAIN_ACTIVITY="android/app/src/main/java/com/dreamavenue/mosqueclock/MainActivity.java"
          cat << 'EOF' > "$MAIN_ACTIVITY"
          package com.dreamavenue.mosqueclock;

          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import android.app.NotificationManager;
          import android.content.Context;
          import android.content.Intent;
          import android.provider.Settings;
          import android.media.AudioManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onResume() {
                  super.onResume();
                  try {
                      WebView webView = getBridge().getWebView();
                      webView.addJavascriptInterface(new SilentBridge(this), "AndroidSilentBridge");
                  } catch (Exception e) {}
              }

              public class SilentBridge {
                  Context context;
                  SilentBridge(Context c) { context = c; }

                  @JavascriptInterface
                  public void requestDNDPermission() {
                      NotificationManager nm = (NotificationManager) context.getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm != null && !nm.isNotificationPolicyAccessGranted()) {
                          Intent intent = new Intent(Settings.ACTION_NOTIFICATION_POLICY_ACCESS_SETTINGS);
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          context.startActivity(intent);
                      }
                  }

                  @JavascriptInterface
                  public void setSilentMode(boolean silent) {
                      NotificationManager nm = (NotificationManager) context.getSystemService(Context.NOTIFICATION_SERVICE);
                      AudioManager am = (AudioManager) context.getSystemService(Context.AUDIO_SERVICE);
                      if (nm != null && am != null && nm.isNotificationPolicyAccessGranted()) {
                          if (silent) {
                              am.setRingerMode(AudioManager.RINGER_MODE_SILENT);
                          } else {
                              am.setRingerMode(AudioManager.RINGER_MODE_NORMAL);
                          }
                      }
                  }
              }
          }
          EOF

      - name: Build Debug APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Ready-to-Install Mosque Clock APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Mosque-Clock-AutoSilent-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
